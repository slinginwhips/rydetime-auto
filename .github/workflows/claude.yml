name: Claude Code

# Mention @claude in an issue (or a comment on one) and Claude works on it,
# then hands back a branch/PR to review. Nothing reaches main until Ryan merges.
# Billed to the RydeTime Auto Anthropic Console account via the
# ANTHROPIC_API_KEY repo secret — not anyone's personal Claude plan.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # This repo is PUBLIC: only Ryan's account can start a run, so a stranger's
    # comment can never spend the API credits.
    if: |
      github.actor == 'slinginwhips' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 40
            --system-prompt "This is the public website for RydeTime Auto, a used-car dealership in Suffolk, VA. The owner (Ryan) is not a developer: explain what you changed in plain English. Read CLAUDE.md first. Never commit secrets or customer data. Never weaken anything around SSNs, credit applications, or SMS consent. Run npx tsc --noEmit before finishing."
